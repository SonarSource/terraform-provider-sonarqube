name: Set up the release tools
description: >-
  Install Terraform at the oldest version that the provider supports, and the
  GoReleaser version that .mise.toml gives.
runs:
  using: composite
  steps:
    - name: Set up Terraform
      uses: ./.github/actions/setup-terraform

    - name: Read the GoReleaser version
      id: goreleaser
      shell: bash
      run: |
        version="$(sed -n 's/^goreleaser = "\(.*\)"$/\1/p' .mise.toml)"
        if [[ -z "${version}" ]]; then
          echo ".mise.toml has no line goreleaser = \"<version>\"."
          exit 1
        fi
        echo "version=v${version}" >> "${GITHUB_OUTPUT}"

    - name: Install GoReleaser
      uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
      with:
        version: ${{ steps.goreleaser.outputs.version }}
        install-only: true

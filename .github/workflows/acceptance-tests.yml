name: Acceptance tests

# This repository is public. A run from a pull_request trigger would give the
# staging credentials to code that nobody examined, so this workflow has no
# pull_request trigger, and never uses pull_request_target. The tests run
# after a merge to master, each night, or by hand. They do not stop a merge,
# because the repository has no merge queue. Add a merge_group trigger when it
# has one.
on:
  push:
    branches:
      - master
  workflow_dispatch:
  # The nightly run finds changes of staging and of the APIs between two
  # merges. GitHub disables the schedule after 60 days without activity in the
  # repository. CONTRIBUTING.md tells how to enable it again.
  schedule:
    # GitHub can delay or drop a scheduled run at the start of an hour.
    - cron: "17 3 * * *"

# Run only one test run against staging at a time. The runs share the test
# organization, and the sweeper of one run could delete what another run
# makes. With "queue: max", the group keeps up to 100 pending runs and starts
# them one at a time. Thus a nightly run does not cancel the pending run of a
# merge.
concurrency:
  group: acceptance-tests
  cancel-in-progress: false
  queue: max

jobs:
  acceptance-tests:
    runs-on: sonar-s
    name: Acceptance tests
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: read
    # The host of the staging instance is a repository variable, because this
    # public repository holds no real host names. The tests and the sweepers
    # delete only on a host that SONARQUBE_TEST_ALLOWED_HOSTS names.
    env:
      SONARQUBE_URL: https://${{ vars.SONARQUBE_STAGING_HOST }}
      SONARQUBE_TEST_ALLOWED_HOSTS: ${{ vars.SONARQUBE_STAGING_HOST }}
    steps:
      - name: Check the repository variable
        env:
          STAGING_HOST: ${{ vars.SONARQUBE_STAGING_HOST }}
        run: |
          if [[ -z "${STAGING_HOST}" ]]; then
            echo "The repository variable SONARQUBE_STAGING_HOST is not set. Set it to the host of the staging instance."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      # The entry is unprotected, so a manual run on a branch can read it too.
      - name: Fetch the Vault secrets
        id: secrets
        uses: SonarSource/vault-action-wrapper@v3
        with:
          secrets: |
            development/team/sonarcloud/kv/data/terraform-provider-acc-dopex token | SONARQUBE_TOKEN;
            development/team/sonarcloud/kv/data/terraform-provider-acc-dopex organization_key | SONARQUBE_TEST_ORGANIZATION;
            development/team/sonarcloud/kv/data/terraform-provider-acc-dopex installation_id_eu | SONARQUBE_TEST_GITHUB_INSTALLATION_ID;
            development/team/sonarcloud/kv/data/terraform-provider-acc-dopex repo_slug | SONARQUBE_TEST_GITHUB_REPOSITORY;

      # A run that stops before its cleanup leaves organizations, projects,
      # groups, quality profiles and gates. The sweepers delete them, so that
      # this run can make them again.
      - name: Sweep what an earlier run left
        env:
          SONARQUBE_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).SONARQUBE_TOKEN }}
          SONARQUBE_TEST_ORGANIZATION: ${{ fromJSON(steps.secrets.outputs.vault).SONARQUBE_TEST_ORGANIZATION }}
        run: make sweep

      - name: Run the acceptance tests against SonarQube Cloud staging
        env:
          SONARQUBE_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).SONARQUBE_TOKEN }}
          SONARQUBE_TEST_ORGANIZATION: ${{ fromJSON(steps.secrets.outputs.vault).SONARQUBE_TEST_ORGANIZATION }}
          SONARQUBE_TEST_GITHUB_INSTALLATION_ID: ${{ fromJSON(steps.secrets.outputs.vault).SONARQUBE_TEST_GITHUB_INSTALLATION_ID }}
          SONARQUBE_TEST_GITHUB_REPOSITORY: ${{ fromJSON(steps.secrets.outputs.vault).SONARQUBE_TEST_GITHUB_REPOSITORY }}
        run: make testacc

  # The tests of GitLab Self-Managed need a GitLab instance that SonarQube
  # Cloud reaches at a public HTTPS address. This job starts GitLab CE in
  # Docker behind an ngrok tunnel, which the sonar-* runners cannot do, so it
  # runs on a Warp runner. It runs after the other job, because the sweeper of
  # that job deletes the organizations of the tests, and the two jobs share
  # the staging instance.
  gitlab-self-managed:
    runs-on: warp-custom-ubuntu-24-04
    name: Acceptance tests of GitLab Self-Managed
    needs: acceptance-tests
    if: ${{ !cancelled() }}
    # The first start of GitLab takes some minutes.
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: read
    env:
      SONARQUBE_URL: https://${{ vars.SONARQUBE_STAGING_HOST }}
      SONARQUBE_TEST_ALLOWED_HOSTS: ${{ vars.SONARQUBE_STAGING_HOST }}
      # The key of the staging enterprise is not secret, but this public
      # repository holds no real identifiers.
      SONARQUBE_TEST_ENTERPRISE_KEY: ${{ vars.SONARQUBE_TEST_ENTERPRISE_KEY }}
    steps:
      - name: Check the repository settings
        env:
          STAGING_HOST: ${{ vars.SONARQUBE_STAGING_HOST }}
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          missing=()
          [[ -n "${STAGING_HOST}" ]] || missing+=("variable SONARQUBE_STAGING_HOST")
          [[ -n "${SONARQUBE_TEST_ENTERPRISE_KEY}" ]] || missing+=("variable SONARQUBE_TEST_ENTERPRISE_KEY")
          [[ -n "${NGROK_AUTHTOKEN}" ]] || missing+=("secret NGROK_AUTHTOKEN")
          if (( ${#missing[@]} > 0 )); then
            echo "These repository settings are not set: ${missing[*]}."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      # The Docker Hub login avoids the limit of anonymous pulls. The GitLab
      # image is large.
      - name: Fetch the Vault secrets
        id: secrets
        uses: SonarSource/vault-action-wrapper@v3
        with:
          secrets: |
            development/team/sonarcloud/kv/data/terraform-provider-acc-dopex token | SONARQUBE_TOKEN;
            development/kv/data/docker/sonardocker login | DOCKER_USERNAME;
            development/kv/data/docker/sonardocker access_token_ro | DOCKER_PASSWORD;

      - name: Log in to Docker Hub
        env:
          DOCKER_USERNAME: ${{ fromJSON(steps.secrets.outputs.vault).DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ fromJSON(steps.secrets.outputs.vault).DOCKER_PASSWORD }}
        run: printf '%s' "${DOCKER_PASSWORD}" | docker login --username "${DOCKER_USERNAME}" --password-stdin

      - name: Start GitLab Self-Managed
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: make gitlab-start

      - name: Run the acceptance tests of GitLab Self-Managed against SonarQube Cloud staging
        env:
          SONARQUBE_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).SONARQUBE_TOKEN }}
        run: make testacc-gitlab

      - name: Stop GitLab Self-Managed
        if: always()
        run: make gitlab-stop

  notify_failure:
    name: Notify Failure
    needs: [acceptance-tests, gitlab-self-managed]
    # A manual run on a branch reports to whoever started it. Only a run on the
    # default branch alerts the squad. A nightly run is on the default branch,
    # so its failure alerts the squad too.
    if: >-
      !cancelled() && failure() &&
      github.ref_name == github.event.repository.default_branch
    permissions:
      id-token: write
      actions: read
    runs-on: sonar-xs
    steps:
      - uses: SonarSource/release-github-actions/notify-failure@v1
        with:
          project-name: terraform-provider-sonarqube
          slack-channel: squad-dopex-on-call
          needs: ${{ toJSON(needs) }}

---
on:
  pull_request:
  merge_group:
  push:
    branches:
      - master

name: pre-commit

jobs:
  pre-commit:
    runs-on: sonar-xs
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: SonarSource/gh-action_pre-commit@1181d422cbd3380624656c4dc46f6172263c0418 # v2

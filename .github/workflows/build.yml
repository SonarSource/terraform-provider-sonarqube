name: Build
on:
  push:
    branches:
      - master
      - branch-*
      - dogfood-*
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:
  build:
    runs-on: sonar-xs
    name: Build
    permissions:
      id-token: write
      contents: read
    env:
      # GitHub gives no OIDC token to a pull request from a fork, so the Vault
      # authentication, and therefore the analysis, cannot work there. The Go
      # steps still run. A step-level `if` can read the env context, a
      # job-level `if` cannot, so the condition lives here.
      SONAR_ANALYSIS_ENABLED: ${{ github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The analysis needs the full history for the blame data.
          fetch-depth: 0

      - name: Set up Go
        uses: ./.github/actions/setup-go

      # Each step runs a check of make check. CONTRIBUTING.md tells how to run
      # them all locally.
      - name: Check the format
        run: make fmt-check

      - name: Check that go.mod and go.sum are tidy
        run: make tidy-check

      - name: Vet
        run: make vet

      - name: Set up the lint tools
        uses: ./.github/actions/setup-lint-tools

      - name: Lint
        run: make lint

      - name: Check for known vulnerabilities
        run: make vulncheck

      - name: Build
        run: make build

      - name: Test
        run: make test TEST_FLAGS="-race -covermode=atomic -coverprofile=coverage.out"

      - name: Fetch the Vault secrets
        if: env.SONAR_ANALYSIS_ENABLED == 'true'
        id: secrets
        uses: SonarSource/vault-action-wrapper@v3
        with:
          secrets: |
            development/kv/data/sonarcloud token | SONAR_TOKEN;

      - name: SonarQube Cloud analysis
        if: env.SONAR_ANALYSIS_ENABLED == 'true'
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          # The `|| '{}'` is necessary. GitHub evaluates the env block of a
          # step even when the condition of that step is false. On a pull
          # request from a fork, the output above is empty, and a bare
          # fromJSON('') stops the job with a template error.
          SONAR_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault || '{}').SONAR_TOKEN }}

  release-check:
    runs-on: sonar-xs
    name: Release check
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser gets the version from the latest tag.
          fetch-depth: 0

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Set up the release tools
        uses: ./.github/actions/setup-release-tools

      - name: Check the release files
        run: make release-check

  docs:
    runs-on: sonar-xs
    name: Docs
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Set up Terraform
        uses: ./.github/actions/setup-terraform

      - name: Check that docs/ agrees with the generated documentation
        run: make docs-check

      - name: Show the changes of docs/
        if: failure()
        run: git diff docs/

      - name: Check the format of the examples
        run: make examples-fmt-check

  notify_failure:
    name: Notify Failure
    needs: [build, release-check, docs]
    if: >-
      !cancelled() && failure() &&
      (github.ref_name == github.event.repository.default_branch ||
      startsWith(github.ref_name, 'branch-') ||
      startsWith(github.ref_name, 'dogfood-'))
    permissions:
      id-token: write
      actions: read
    runs-on: sonar-xs
    steps:
      - uses: SonarSource/release-github-actions/notify-failure@v1
        with:
          project-name: terraform-provider-sonarqube
          slack-channel: squad-dopex-on-call
          needs: ${{ toJSON(needs) }}

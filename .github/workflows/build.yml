name: Build
on:
  push:
    branches:
      - master
      - branch-*
      - dogfood-*
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:
  build:
    # For guidance on runner selection, visit:
    # https://xtranet-sonarsource.atlassian.net/wiki/spaces/Platform/pages/3694231566/GitHub+Actions+Runner+-+GitHub
    runs-on: sonar-xs
    name: Build
    permissions:
      id-token: write
      contents: read
    env:
      # GitHub gives no OIDC token to a pull request from a fork, so the Vault
      # authentication, and therefore the analysis, cannot work there. The Go
      # steps still run. A step-level `if` can read the env context, a
      # job-level `if` cannot, so the condition lives here.
      SONAR_ANALYSIS_ENABLED: ${{ github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The analysis needs the full history for the blame data.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check the format
        run: |
          unformatted=$(gofmt -l .)
          if [[ -n "${unformatted}" ]]; then
            echo "These files are not gofmt-formatted:"
            echo "${unformatted}"
            exit 1
          fi

      - name: Check that go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Fetch the Vault secrets
        if: env.SONAR_ANALYSIS_ENABLED == 'true'
        id: secrets
        uses: SonarSource/vault-action-wrapper@a7fa5fd4a4e4e0f2593f6137c0812cac196cf4ce # 3.7.0
        with:
          secrets: |
            development/kv/data/sonarcloud token | SONAR_TOKEN;

      - name: SonarQube Cloud analysis
        if: env.SONAR_ANALYSIS_ENABLED == 'true'
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          # The `|| '{}'` is necessary. GitHub evaluates the env block of a
          # step even when the condition of that step is false. On a pull
          # request from a fork, the output above is empty, and a bare
          # fromJSON('') stops the job with a template error.
          SONAR_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault || '{}').SONAR_TOKEN }}

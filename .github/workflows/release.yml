---
name: Release
# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
        type: string

jobs:
  release:
    permissions:
      id-token: write
      contents: write
    uses: SonarSource/gh-action_release/.github/workflows/main.yaml@bf4faffefea8fce5e434a3b185d2ac03fba5592c # 7.7.1
    with:
      version: ${{ inputs.version }}

  notify_failure:
    name: Notify Failure
    needs: release
    if: "!cancelled() && failure()"
    permissions:
      id-token: write
      actions: read
    runs-on: sonar-xs
    steps:
      - uses: SonarSource/release-github-actions/notify-failure@e9a93a9d84a482a3a90d750cd3079d645b7d423a # 1.9.16
        with:
          project-name: terraform-provider-sonarqube
          slack-channel: squad-dopex-on-call
          needs: ${{ toJSON(needs) }}

# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
---
# pre-commit install installs the hook of each stage. The pre-push hook runs
# make check, so that a push gets the result of CI before CI runs. The CI
# workflow runs only the pre-commit stage.
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      - id: make-check
        name: make check
        entry: make check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: 5b5dddc4fb0f83c3ea1fc5616fa63e115dce83e0  # frozen: v0.49.1
    hooks:
      - id: markdownlint
        # tfplugindocs writes docs/. Its output does not follow these rules, and
        # the docs job of the build workflow checks it. A *_resource.md file is
        # the start of a page in docs/, so it has no heading on its first line.
        exclude: ^docs/|_resource\.md$
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95  # frozen: v0.11.0.1
    hooks:
      - id: shellcheck
        # The import.sh files of examples/ go into docs/ without a shebang.
        args: [--shell=bash]
